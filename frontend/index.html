<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Task Manager</title>

    <style>
    body {
        font-family: Arial, sans-serif;
        background: #f5f7fa;
        margin: 0;
        padding: 40px;
    }

    .container {
        max-width: 1000px;
        margin: auto;
    }

    h1 {
        margin-bottom: 5px;
    }

    .subtitle {
        color: #666;
        margin-bottom: 30px;
    }

    .stats {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 20px;
        margin-bottom: 30px;
    }

    .stat-card {
        background: white;
        padding: 20px;
        border-radius: 10px;
        box-shadow: 0 2px 8px rgba(0,0,0,0.08);
    }

    .stat-card h3 {
        margin: 0 0 10px;
        color: #666;
        font-size: 14px;
    }

    .stat-card p {
        margin: 0;
        font-size: 28px;
        font-weight: bold;
    }

    .team {
        display: grid;
        grid-template-columns: repeat(4, 1fr);
        gap: 15px;
        margin-bottom: 30px;
    }

    .member-card {
        background: white;
        padding: 18px;
        border-radius: 10px;
        box-shadow: 0 2px 8px rgba(0,0,0,0.08);
    }

    .member-card h3 {
        font-size: 15px;
        margin-bottom: 8px;
    }

    .member-card p {
        color: #666;
        margin: 0;
    }

    .create-task {
        background: white;
        padding: 20px;
        border-radius: 10px;
        margin-bottom: 30px;
        box-shadow: 0 2px 8px rgba(0,0,0,0.08);
    }

    .create-task input,
    .create-task select {
        padding: 12px;
        margin-right: 8px;
        border: 1px solid #ccc;
        border-radius: 6px;
    }

    button {
        padding: 12px 18px;
        border: none;
        border-radius: 6px;
        cursor: pointer;
        background: #222;
        color: white;
    }

    .tasks {
        background: white;
        padding: 20px;
        border-radius: 10px;
        box-shadow: 0 2px 8px rgba(0,0,0,0.08);
    }

    .task-item {
        padding: 15px;
        border-bottom: 1px solid #eee;
        cursor: pointer;
        display: flex;
        justify-content: space-between;
        align-items: center;
    }

    .task-item:last-child {
        border-bottom: none;
    }
    .task-item {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 15px;
    border-bottom: 1px solid #eee;
}

.task-item button {
    margin-left: 20px;
    padding: 8px 14px;
}

.task-item button:disabled {
    background: #aaa;
    cursor: not-allowed;
}

    .completed {
        text-decoration: line-through;
        color: #888;
    }
    </style>
</head>

<body>
    <div class="container">

        <h1>Bharanidar</h1>
        <p class="subtitle">Team Dashboard</p>

        <div class="stats">

            <div class="stat-card">
                <h3>Total Tasks</h3>
                <p id="totalTasks">0</p>
            </div>

            <div class="stat-card">
                <h3>Pending</h3>
                <p id="pendingTasks">0</p>
            </div>

            <div class="stat-card">
                <h3>Completed</h3>
                <p id="completedTasks">0</p>
            </div>

        </div>

        <h2>Team Members</h2>

        <div class="team">

            <div class="member-card">
                <h3>UX Designer</h3>
                <p id="uiuxCount">0 tasks</p>
            </div>

            <div class="member-card">
                <h3>Frontend Developer</h3>
                <p id="developerCount">0 tasks</p>
            </div>

            <div class="member-card">
                <h3>Tester / QA</h3>
                <p id="testerCount">0 tasks</p>
            </div>

            <div class="member-card">
                <h3>Backend Developer</h3>  
                <p id="devopsCount">0 tasks</p>
            </div>

        </div>

        <div class="create-task">

            <h2>Create Task</h2>

            <input
                type="text"
                id="taskInput"
                placeholder="Enter a task"
            >

            <select id="roleInput">
                <option value="">Select role</option>
                <option value="UX Designer">UX Designer</option>
                <option value="Frontend Developer">Frontend Developer</option>
                <option value="Tester / QA">Tester / QA</option>
                <option value="Backend Developer">Backend Developer</option>
            </select>

            <button onclick="createTask()">Add Task</button>

        </div>

        <div class="tasks">

            <h2>Tasks</h2>

            <ul id="taskList"></ul>

        </div>

    </div>
    <script>
        const API_URL = "https://task-manager-backend-j1lc.onrender.com/tasks";

        async function loadTasks() {
            const response = await fetch(API_URL);
            const tasks = await response.json();

            const taskList = document.getElementById("taskList");
            taskList.innerHTML = "";

            // Calculate statistics
            const totalTasks = tasks.length;

            const pendingTasks = tasks.filter(
                task => task.status === "pending"
            ).length;

            const completedTasks = tasks.filter(
                task => task.status === "completed"
            ).length;

            // Count tasks for each role
            const uiuxTasks = tasks.filter(
                task => task.assigned_role === "UX Designer"
            ).length;

            const developerTasks = tasks.filter(
                task => task.assigned_role === "Frontend Developer"
            ).length;

            const testerTasks = tasks.filter(
                task => task.assigned_role === "Tester / QA"
            ).length;

            const devopsTasks = tasks.filter(
                task => task.assigned_role === "Backend Developer"
            ).length;

            // Update dashboard statistics
            document.getElementById("totalTasks").textContent = totalTasks;
            document.getElementById("pendingTasks").textContent = pendingTasks;
            document.getElementById("completedTasks").textContent = completedTasks;

            document.getElementById("uiuxCount").textContent = `${uiuxTasks} tasks`;
            document.getElementById("developerCount").textContent = `${developerTasks} tasks`;
            document.getElementById("testerCount").textContent = `${testerTasks} tasks`;
            document.getElementById("devopsCount").textContent = `${devopsTasks} tasks`;

            // Display tasks
            tasks.forEach(task => {
                const li = document.createElement("li");
                li.classList.add("task-item");

                const taskInfo = document.createElement("div");
                taskInfo.style.display = "flex";
                taskInfo.style.flexDirection = "column";

                taskInfo.innerHTML = `
                    <strong>${task.title}</strong>
                    <span>${task.assigned_role}</span>
                    <small>Status: ${task.status.replace("_", " ")}</small>
                `;

                const button = document.createElement("button");

                if (task.status === "pending") {
                    button.textContent = "Start Task";
                    button.onclick = () => updateTask(task.id, task.status);
                } else if (task.status === "in_progress") {
                    button.textContent = "Complete Task";
                    button.onclick = () => updateTask(task.id, task.status);
                } else {
                    button.textContent = "Completed ✓";
                    button.disabled = true;
                }

                li.appendChild(taskInfo);
                li.appendChild(button);

                if (task.status === "completed") {
                    li.classList.add("completed");
                }

                taskList.appendChild(li);
            });
        }

        async function createTask() {
            const input = document.getElementById("taskInput");
            const roleInput = document.getElementById("roleInput");

            const title = input.value.trim();
            const assignedRole = roleInput.value;

            if (!assignedRole) {
                alert("Please select a role");
                return;
            }

            if (!title) {
                alert("Please enter a task");
                return;
            }

            await fetch(API_URL, {
                method: "POST",
                headers: {
                    "Content-Type": "application/json"
                },
                body: JSON.stringify({
                    title: title,
                    assigned_role: assignedRole
                })
            });

            input.value = "";
            roleInput.value = "";

            loadTasks();
        }

        async function updateTask(taskId, currentStatus) {
            let nextStatus;

            if (currentStatus === "pending") {
                nextStatus = "in_progress";
            } else if (currentStatus === "in_progress") {
                nextStatus = "completed";
            } else {
                return;
            }

            await fetch(`${API_URL}/${taskId}`, {
                method: "PUT",
                headers: {
                    "Content-Type": "application/json"
                },
                body: JSON.stringify({
                    status: nextStatus
                })
            });

            loadTasks();
        }

        // Initial load
        document.addEventListener('DOMContentLoaded', loadTasks);
    </script>

</body>
</html>
